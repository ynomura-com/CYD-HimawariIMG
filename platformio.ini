; ひまわり トゥルーカラー表示 for CYD (ESP32-2432S028)
[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 460800
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  bodmer/TJpg_Decoder@^1.1.0
  bblanchon/ArduinoJson@^7.0.0
  https://github.com/PaulStoffregen/XPT2046_Touchscreen.git

; TFT_eSPI の User_Setup を編集せずに済むよう、ピン設定はここで指定
build_flags =
  -DUSER_SETUP_LOADED=1
  -DILI9341_2_DRIVER=1
  -DUSE_HSPI_PORT=1
  -DTFT_WIDTH=240
  -DTFT_HEIGHT=320
  -DTFT_MISO=12
  -DTFT_MOSI=13
  -DTFT_SCLK=14
  -DTFT_CS=15
  -DTFT_DC=2
  -DTFT_RST=-1
  -DTFT_BL=21
  -DTFT_BACKLIGHT_ON=HIGH
  -DLOAD_GLCD=1
  -DSPI_FREQUENCY=40000000
  -DSPI_READ_FREQUENCY=20000000
  ; --- 画面が真っ暗な場合の切り替え候補 ---
  ; ST7789 搭載の個体は ILI9341_2_DRIVER を ST7789_DRIVER に替える
  ; (色の反転・赤青の入れ替わりは include/config.h の DISPLAY_INVERT / DISPLAY_SWAP_RB で設定)
